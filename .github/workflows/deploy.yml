name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out private UI package
        uses: actions/checkout@v7
        with:
          repository: timkpaine/ui
          token: ${{ secrets.UI_REPO_TOKEN }}
          path: _ui

      - name: Position UI package for local dependency
        run: mv "$GITHUB_WORKSPACE/_ui" "$(dirname "$(dirname "$GITHUB_WORKSPACE")")/ui"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Build UI package
        run: |
          cd "$(dirname "$(dirname "$GITHUB_WORKSPACE")")/ui"
          pnpm install --frozen-lockfile
          pnpm build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check project
        run: pnpm check

      - name: Lint project
        run: pnpm lint

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test site behavior and accessibility
        run: pnpm test:e2e
        env:
          CI: '1'

      - name: Build site
        run: pnpm build

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 900000
