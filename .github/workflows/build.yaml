name: Build Status

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - name: Check out private UI package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: timkpaine/ui
          token: ${{ secrets.UI_REPO_TOKEN }}
          path: _ui
          persist-credentials: false

      # A change here often needs a matching change in the UI package, and the
      # two land in separate pull requests. Without this the site is tested
      # against the UI package's default branch, so a paired branch fails until
      # its counterpart merges - which looks like this repository is broken.
      - name: Use the matching UI branch when there is one
        env:
          UI_TOKEN: ${{ secrets.UI_REPO_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          cd "$GITHUB_WORKSPACE/_ui"
          remote="https://x-access-token:${UI_TOKEN}@github.com/timkpaine/ui.git"
          if git ls-remote --exit-code --heads "$remote" "$BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 "$remote" "$BRANCH"
            git checkout --detach FETCH_HEAD
            echo "@timkpaine/ui: using branch $BRANCH"
          else
            echo "@timkpaine/ui: no branch named $BRANCH, using the default branch"
          fi

      - name: Position UI package for local dependency
        run: mv "$GITHUB_WORKSPACE/_ui" "$(dirname "$(dirname "$GITHUB_WORKSPACE")")/ui"

      - name: Setup Node.js
        uses: actions-ext/node/setup@b0536d87c5e92c924bc8667f566f620758280825
        with:
          version: 22.x
          js_folder: .

      - name: Build UI package
        run: |
          cd "$(dirname "$(dirname "$GITHUB_WORKSPACE")")/ui"
          pnpm install --frozen-lockfile
          pnpm build

      - run: pnpm install
      - run: pnpm build
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
        env:
          CI: '1'
