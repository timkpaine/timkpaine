name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out private UI package
        uses: actions/checkout@v7
        with:
          repository: timkpaine/ui
          token: ${{ secrets.UI_REPO_TOKEN }}
          path: _ui

      - name: Position UI package for local dependency
        run: mv "$GITHUB_WORKSPACE/_ui" "$(dirname "$(dirname "$GITHUB_WORKSPACE")")/ui"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Build UI package
        run: |
          cd "$(dirname "$(dirname "$GITHUB_WORKSPACE")")/ui"
          pnpm install --frozen-lockfile
          pnpm build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check project
        run: pnpm check

      - name: Lint project
        run: pnpm lint

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test site behavior and accessibility
        run: pnpm test:e2e
        env:
          CI: '1'

      - name: Build site
        run: pnpm build

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 35
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const artifactName = 'github-pages'
            const { owner, repo } = context.repo
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: context.runId,
              name: artifactName,
              per_page: 100
            })
            const artifacts = data.artifacts.filter(
              artifact => artifact.name === artifactName && !artifact.expired
            )

            if (artifacts.length !== 1) {
              throw new Error(
                `Expected one ${artifactName} artifact, found ${artifacts.length}`
              )
            }

            const oidcToken = await core.getIDToken()
            const { data: deployment } = await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments',
              {
                owner,
                repo,
                artifact_id: artifacts[0].id,
                pages_build_version: context.sha,
                oidc_token: oidcToken
              }
            )
            const deploymentId =
              deployment.id ??
              deployment.status_url?.split('/').pop() ??
              context.sha
            const finalErrors = {
              deployment_failed: 'Deployment failed',
              deployment_content_failed: 'Artifact content could not be deployed',
              deployment_cancelled: 'Deployment was cancelled',
              deployment_lost: 'Deployment failed to report final status'
            }
            const pollInterval = 5000
            const timeout = 30 * 60 * 1000
            const startedAt = Date.now()

            core.setOutput('page_url', deployment.page_url ?? '')

            while (Date.now() - startedAt < timeout) {
              await new Promise(resolve => setTimeout(resolve, pollInterval))
              const { data: status } = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}',
                { owner, repo, deploymentId }
              )

              core.info(`Current status: ${status.status}`)
              if (status.status === 'succeed') {
                core.info('Reported success!')
                return
              }
              if (finalErrors[status.status]) {
                throw new Error(finalErrors[status.status])
              }
            }

            await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel',
              { owner, repo, deploymentId }
            )
            throw new Error('Pages deployment timed out after 30 minutes')
